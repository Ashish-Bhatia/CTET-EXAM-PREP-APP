[project]
name = "ctet-exam-prep-app"
version = "0.1.0"
description = "CTET exam preparation platform"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
